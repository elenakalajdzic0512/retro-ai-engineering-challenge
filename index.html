<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Breaker</title>
  </head>
  <body>
    <main>
      <h1>NEON BREAKER</h1>
      <div class="hud"><span id="score">Score: 0</span><span id="lives">Lives: 3</span></div>
      <canvas id="game" width="800" height="600" aria-label="Neon Breaker playfield">This game requires Canvas support.</canvas>
      <p id="status" role="status"></p>
      <p class="controls">Move: ← → or A / D · Launch / restart: Space</p>
      <section class="ai-hint" aria-labelledby="ai-hint-heading">
        <h2 id="ai-hint-heading">AI Hint</h2>
        <button id="ai-hint-button" type="button">Ask AI for Hint</button>
        <p id="ai-hint-status" role="status" aria-live="polite"></p>
        <p id="ai-hint-result" aria-live="polite"></p>
      </section>
      <section class="tactical-coach" aria-labelledby="tactical-coach-heading">
        <h2 id="tactical-coach-heading">AI Tactical Coach</h2>
        <form id="tactical-coach-form">
          <label for="tactical-coach-goal">Your goal</label>
          <input id="tactical-coach-goal" type="text" placeholder="e.g. Clear the center safely" autocomplete="off" />
          <button id="tactical-coach-button" type="submit">Run Tactical Coach</button>
        </form>
        <p id="tactical-coach-status" role="status" aria-live="polite"></p>
        <div id="tactical-coach-result" aria-live="polite"></div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
