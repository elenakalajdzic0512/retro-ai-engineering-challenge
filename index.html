<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Breaker</title>
  </head>
  <body>
    <main>
      <h1>NEON BREAKER</h1>
      <div class="hud"><span id="score">Score: 0</span><span id="lives">Lives: 3</span></div>
      <canvas id="game" width="800" height="600" aria-label="Neon Breaker playfield">This game requires Canvas support.</canvas>
      <p id="status" role="status"></p>
      <p class="controls">Move: ← → or A / D · Launch / restart: Space</p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
